# Fill in each `default:` model with the id you want the runner to launch
# with; dev/rollover/rollover_e2e.py overrides it per-harness at session
# create time via E2E_CLAUDE_MODEL / E2E_CODEX_MODEL / E2E_PI_MODEL (see
# dev/rollover/README.md), so what's here only matters when those are unset.
providers:
  anthropic:
    anthropic:
      api_key_ref: env:ANTHROPIC_API_KEY
      base_url: https://api.anthropic.com
      models:
        default: <your-default-model>
    default: anthropic
    kind: key
  openai:
    openai:
      api_key_ref: env:OPENAI_API_KEY
      base_url: https://api.openai.com/v1
      models:
        default: <your-default-model>
    default: openai
    kind: key
  openrouter:
    default: pi
    kind: gateway
    openai:
      api_key_ref: env:OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
      models:
        default: <your-default-model>
      wire_api: chat
